apiVersion: v1
kind: ConfigMap
metadata:
  name: liberty-config
  namespace: clm-vault-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en" class="cds--g100">
    <head>
      <meta charset="UTF-8">
      <title>Open Liberty | Certificate Lifecycle Management</title>
      <link rel="stylesheet" href="https://1.www.s81c.com/common/carbon/plex/fonts.css">
      <style>
        body { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #161616; color: #f4f4f4; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .cds--tile { background: #262626; border: 1px solid #393939; padding: 2rem; max-width: 680px; width: 100%; border-top: 3px solid #0f62fe; }
        h1 { font-size: 1.5rem; font-weight: 400; color: #f4f4f4; margin: 0.5rem 0 0.75rem 0; }
        .cds--tag { display: inline-flex; align-items: center; background: #0043ce; color: #d0e2ff; padding: 0.25rem 0.5rem; border-radius: 0.9375rem; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.32px; }
        .cds--meta-table { background: #1f1f1f; border: 1px solid #393939; padding: 1rem; margin: 1.25rem 0; font-family: 'IBM Plex Mono', monospace; font-size: 0.8125rem; line-height: 1.5; }
        .cds--meta-table div { margin-bottom: 0.35rem; }
        .cds--meta-table div:last-child { margin-bottom: 0; }
        .cds--links { display: flex; gap: 1rem; margin-top: 1.25rem; flex-wrap: wrap; }
        .cds--link { color: #78a9ff; text-decoration: none; font-size: 0.8125rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.25rem; }
        .cds--link:hover { text-decoration: underline; color: #a6c8ff; }
      </style>
    </head>
    <body>
      <div class="cds--tile">
        <span class="cds--tag">Scenario 1</span>
        <h1>Open Liberty TLS Endpoint</h1>
        <p style="color: #c6c6c6; font-size: 0.875rem;">This Open Liberty server is configured with <strong>HashiCorp Vault Internal PKI</strong> for automated zero-downtime TLS certificate lifecycle management.</p>
        <div class="cds--meta-table">
          <div><strong style="color: #8d8d8d;">Keystore Path:</strong> ${server.config.dir}/resources/security/</div>
          <div><strong style="color: #8d8d8d;">Dynamic Reload:</strong> dynamicUpdate="true" (Zero Downtime Hot-Swap)</div>
          <div><strong style="color: #8d8d8d;">Vault Role:</strong> pki_internal/issue/liberty-role</div>
          <div><strong style="color: #8d8d8d;">Rotation Interval:</strong> Every 5 Minutes</div>
        </div>
        <p style="color: #8d8d8d; font-size: 0.8125rem;">Inspect the TLS certificate in your browser (lock icon) to view the current Serial Number and validity window issued by Vault.</p>
        <div class="cds--links">
          <a class="cds--link" href="/health" target="_blank">↗ MicroProfile Health (/health)</a>
          <a class="cds--link" href="/health/ready" target="_blank">↗ Readiness Check</a>
          <a class="cds--link" href="/health/live" target="_blank">↗ Liveness Check</a>
        </div>
      </div>
    </body>
    </html>

  server.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <server description="Open Liberty CLM Demo Server">
        <featureManager>
            <feature>transportSecurity-1.0</feature>
            <feature>servlet-6.0</feature>
            <feature>mpHealth-4.0</feature>
        </featureManager>

        <httpEndpoint id="defaultHttpEndpoint" host="*" httpPort="9080" httpsPort="9443" />

        <!-- Industry-Standard PKCS12 Keystore with Dynamic Hot-Reload -->
        <keyStore id="vaultKeyStore"
                  location="${server.config.dir}/resources/security/key.p12"
                  type="PKCS12"
                  password="changeit" />

        <ssl id="defaultSSLConfig"
             keyStoreRef="vaultKeyStore"
             sslProtocol="TLSv1.2,TLSv1.3" />

        <sslDefault sslRef="defaultSSLConfig" />

        <!-- Explicit Root Web Application for CLM Dashboard -->
        <webApplication id="clm-root-app"
                        name="clm-root-app"
                        location="${server.config.dir}/apps/ROOT.war"
                        contextRoot="/" />

        <logging consoleLogLevel="INFO" />
    </server>
  agent.py: |
    #!/usr/bin/env python3
    import http.server
    import socketserver
    import urllib.request
    import urllib.error
    import json
    import os
    import sys
    import time
    import ssl
    import subprocess
    import tempfile
    import threading
    from datetime import datetime, timezone

    sys.stdout.reconfigure(line_buffering=True)
    sys.stderr.reconfigure(line_buffering=True)

    VAULT_ADDR = os.environ.get("VAULT_ADDR", "http://vault.clm-vault-demo.svc.cluster.local:8200")
    WORKLOAD = "liberty"
    ROLE_NAME = "liberty-role"
    COMMON_NAME = "liberty.clm-vault-demo.svc"
    ALT_NAMES = "localhost,liberty,liberty-clm-vault-demo,liberty.clm-vault-demo,liberty.clm-vault-demo.svc,liberty.clm-vault-demo.svc.cluster.local,liberty-clm-vault-demo.apps.cetcluster.iic.hu.ibm.com,*.apps.cetcluster.iic.hu.ibm.com"
    PORT = 8000
    TARGET_DIR = "/config/resources/security"

    STATE_LOCK = threading.Lock()
    CERT_META = {
        "serial": "",
        "valid_from": "",
        "valid_to": "",
        "issuer": "Enterprise Demo Intermediate CA",
        "subject": "",
        "last_renewed": "",
        "status": "INITIALIZING"
    }
    CONFIG = {
        "interval_seconds": 300,
        "last_renewal_ts": 0
    }

    def log_msg(msg):
        ts = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
        print(f"[{ts}] [Open Liberty Cert Agent] {msg}", flush=True)

    def get_k8s_token():
        token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        if os.path.exists(token_path):
            with open(token_path, "r") as f:
                return f.read().strip()
        return ""

    def get_vault_token():
        sa_token = get_k8s_token()
        if not sa_token:
            return "root"
        try:
            req = urllib.request.Request(
                f"{VAULT_ADDR}/v1/auth/kubernetes/login",
                data=json.dumps({"jwt": sa_token, "role": ROLE_NAME}).encode("utf-8"),
                headers={"Content-Type": "application/json"}
            )
            with urllib.request.urlopen(req, timeout=5) as resp:
                data = json.loads(resp.read().decode())
                return data.get("auth", {}).get("client_token", "root")
        except Exception as e:
            log_msg(f"Vault login error: {e}")
            return "root"

    def vault_request(path, method="GET", payload=None):
        token = get_vault_token()
        url = f"{VAULT_ADDR}/v1/{path.lstrip('/')}"
        data = json.dumps(payload).encode("utf-8") if payload else None
        req = urllib.request.Request(url, data=data, method=method)
        req.add_header("X-Vault-Token", token)
        req.add_header("Content-Type", "application/json")
        try:
            with urllib.request.urlopen(req, timeout=8) as resp:
                return json.loads(resp.read().decode())
        except urllib.error.HTTPError as e:
            body = e.read().decode() if e.fp else ""
            return {"error": f"HTTP {e.code}: {body}"}
        except Exception as e:
            return {"error": str(e)}

    def parse_x509_pem(pem_str):
        res = {
            "valid_from": "",
            "valid_to": "",
            "serial": "",
            "issuer": "Enterprise Demo Intermediate CA",
            "subject": ""
        }
        if not pem_str or "BEGIN CERTIFICATE" not in pem_str:
            return res
        temp_path = None
        try:
            with tempfile.NamedTemporaryFile("w+", delete=False, suffix=".pem") as tf:
                tf.write(pem_str)
                tf.flush()
                temp_path = tf.name
            decoded = ssl._ssl._test_decode_cert(temp_path)
            res["valid_from"] = decoded.get("notBefore", "")
            res["valid_to"] = decoded.get("notAfter", "")
            raw_serial = decoded.get("serialNumber", "").lower()
            if raw_serial and ":" not in raw_serial:
                res["serial"] = ":".join(raw_serial[i:i+2] for i in range(0, len(raw_serial), 2))
            else:
                res["serial"] = raw_serial
            for rdn in decoded.get("subject", ()):
                for k, v in rdn:
                    if k == "commonName":
                        res["subject"] = v
            for rdn in decoded.get("issuer", ()):
                for k, v in rdn:
                    if k in ("organizationName", "commonName"):
                        res["issuer"] = v
        except Exception:
            pass
        finally:
            if temp_path and os.path.exists(temp_path):
                try:
                    os.remove(temp_path)
                except Exception:
                    pass
        return res

    def issue_and_apply_cert():
        log_msg(f"Requesting new certificate directly from Vault PKI (/v1/pki_internal/issue/{ROLE_NAME})...")
        resp = vault_request(f"pki_internal/issue/{ROLE_NAME}", method="POST", payload={
            "common_name": COMMON_NAME,
            "alt_names": ALT_NAMES,
            "ip_sans": "127.0.0.1",
            "private_key_format": "pkcs8",
            "ttl": "10m"
        })

        data = resp.get("data", {})
        cert = data.get("certificate", "")
        key = data.get("private_key", "")
        ca = data.get("issuing_ca", "")
        serial = data.get("serial_number", "")

        if not cert or not key:
            err = resp.get("error", "No cert returned from Vault")
            log_msg(f"Failed to issue cert from Vault: {err}")
            return False, err

        os.makedirs(TARGET_DIR, exist_ok=True)
        with open(f"{TARGET_DIR}/tls.crt.tmp", "w") as f: f.write(cert)
        with open(f"{TARGET_DIR}/tls.key.tmp", "w") as f: f.write(key)
        with open(f"{TARGET_DIR}/ca.crt.tmp", "w") as f: f.write(ca)
        with open(f"{TARGET_DIR}/serial.txt.tmp", "w") as f: f.write(serial)

        cmd = [
            "openssl", "pkcs12", "-export",
            "-in", f"{TARGET_DIR}/tls.crt.tmp",
            "-inkey", f"{TARGET_DIR}/tls.key.tmp",
            "-certfile", f"{TARGET_DIR}/ca.crt.tmp",
            "-out", f"{TARGET_DIR}/key.p12.tmp",
            "-name", "default",
            "-passout", "pass:changeit"
        ]
        res = subprocess.run(cmd, capture_output=True, text=True)
        if res.returncode != 0:
            log_msg(f"openssl pkcs12 export failed: {res.stderr}")
            return False, f"PKCS12 export error: {res.stderr}"

        os.replace(f"{TARGET_DIR}/key.p12.tmp", f"{TARGET_DIR}/key.p12")
        os.replace(f"{TARGET_DIR}/tls.crt.tmp", f"{TARGET_DIR}/tls.crt")
        os.replace(f"{TARGET_DIR}/tls.key.tmp", f"{TARGET_DIR}/tls.key")
        os.replace(f"{TARGET_DIR}/ca.crt.tmp", f"{TARGET_DIR}/ca.crt")
        os.replace(f"{TARGET_DIR}/serial.txt.tmp", f"{TARGET_DIR}/serial.txt")

        meta = parse_x509_pem(cert)
        now_iso = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

        # Record in Vault Central KV Inventory
        vault_request("kv/data/certificates/liberty/current", method="POST", payload={
            "data": {
                "workload": "liberty",
                "serial_number": serial,
                "status": "ACTIVE",
                "last_sync": now_iso
            }
        })

        with STATE_LOCK:
            CERT_META["serial"] = meta.get("serial") or serial
            CERT_META["valid_from"] = meta.get("valid_from")
            CERT_META["valid_to"] = meta.get("valid_to")
            CERT_META["issuer"] = meta.get("issuer")
            CERT_META["subject"] = meta.get("subject")
            CERT_META["last_renewed"] = now_iso
            CERT_META["status"] = "ACTIVE"
            CONFIG["last_renewal_ts"] = time.time()

        log_msg(f"PKCS12 Keystore (/config/resources/security/key.p12) updated! Serial: {CERT_META['serial']}")
        return True, CERT_META["serial"]

    class SidecarHandler(http.server.BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            pass

        def do_GET(self):
            clean_path = self.path.split("?")[0]
            if clean_path in ("/status", "/cert", "/"):
                self.handle_status()
            elif clean_path == "/health":
                self.send_json({"status": "UP", "workload": WORKLOAD})
            else:
                self.send_error(404, "Endpoint not found")

        def do_POST(self):
            clean_path = self.path.split("?")[0]
            content_len = int(self.headers.get("Content-Length", 0))
            post_body = self.rfile.read(content_len).decode("utf-8") if content_len > 0 else "{}"
            try:
                body = json.loads(post_body) if post_body else {}
            except Exception:
                body = {}

            if clean_path == "/renew":
                log_msg("On-demand renewal requested via Sidecar API...")
                success, result = issue_and_apply_cert()
                if success:
                    self.send_json({
                        "success": True,
                        "serial": result,
                        "message": f"Certifikat za Open Liberty uspješno obnovljen putem Sidecara (Serial: {result})!"
                    })
                else:
                    self.send_json({
                        "success": False,
                        "error": result,
                        "message": f"Greška pri obnovi certifikata za Open Liberty: {result}"
                    }, code=500)
            elif clean_path == "/schedule":
                new_interval = int(body.get("interval_seconds", 300))
                with STATE_LOCK:
                    CONFIG["interval_seconds"] = max(30, new_interval)
                log_msg(f"Interval rotacije postavljen na {CONFIG['interval_seconds']}s.")
                self.send_json({
                    "success": True,
                    "interval_seconds": CONFIG["interval_seconds"],
                    "message": f"Interval rotacije za Open Liberty postavljen na {CONFIG['interval_seconds']}s."
                })
            else:
                self.send_error(404, "Endpoint not found")

        def send_json(self, data, code=200):
            self.send_response(code)
            self.send_header("Content-Type", "application/json; charset=utf-8")
            self.send_header("Access-Control-Allow-Origin", "*")
            self.send_header("Cache-Control", "no-cache, no-store, must-revalidate, max-age=0")
            self.end_headers()
            self.wfile.write(json.dumps(data, indent=2).encode("utf-8"))

        def handle_status(self):
            with STATE_LOCK:
                elapsed = int(time.time() - CONFIG["last_renewal_ts"]) if CONFIG["last_renewal_ts"] > 0 else 0
                expires_in = max(0, CONFIG["interval_seconds"] - elapsed)
                data = {
                    "workload": WORKLOAD,
                    "name": "Open Liberty Java Server",
                    "scenario": "Scenario 1: Interni Vault PKI",
                    "ca_provider": "Vault Internal PKI (/v1/pki_internal)",
                    "keystore_format": "PKCS12 Keystore (/config/resources/security/key.p12)",
                    "reload_mechanism": "Open Liberty dynamicUpdate='true' (Zero Downtime)",
                    "serial": CERT_META["serial"],
                    "valid_from": CERT_META["valid_from"],
                    "valid_to": CERT_META["valid_to"],
                    "expires_in_sec": expires_in,
                    "rotation_interval_seconds": CONFIG["interval_seconds"],
                    "status": CERT_META["status"],
                    "last_renewed": CERT_META["last_renewed"],
                    "issuer": CERT_META["issuer"],
                    "subject": CERT_META["subject"],
                    "host": f"{WORKLOAD}.clm-vault-demo.svc.cluster.local",
                    "port": 9443
                }
            self.send_json(data)

    def rotation_worker():
        log_msg("Background rotation worker thread started.")
        while True:
            time.sleep(1)
            with STATE_LOCK:
                interval = CONFIG["interval_seconds"]
                last_ts = CONFIG["last_renewal_ts"]
            if last_ts > 0 and (time.time() - last_ts) >= interval:
                log_msg(f"Rotation timer reached ({interval}s). Renewing Open Liberty certificate...")
                issue_and_apply_cert()

    if __name__ == "__main__":
        if "--init" in sys.argv or os.environ.get("INIT_MODE") == "true":
            log_msg("Running in INIT mode (one-shot issuance)...")
            while True:
                ok, res = issue_and_apply_cert()
                if ok:
                    log_msg(f"Init keystore ready (Serial: {res}). Exiting init container.")
                    sys.exit(0)
                log_msg("Waiting for Vault to be ready...")
                time.sleep(2)

        # Initial issuance for runtime sidecar
        while True:
            ok, res = issue_and_apply_cert()
            if ok:
                break
            log_msg("Waiting for Vault to be ready...")
            time.sleep(2)

        t = threading.Thread(target=rotation_worker, daemon=True)
        t.start()

        server_address = ("0.0.0.0", PORT)
        httpd = socketserver.TCPServer(server_address, SidecarHandler)
        log_msg(f"Sidecar HTTP API listening on port {PORT}...")
        try:
            httpd.serve_forever()
        except KeyboardInterrupt:
            pass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liberty
  namespace: clm-vault-demo
  labels:
    app: liberty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liberty
  template:
    metadata:
      labels:
        app: liberty
    spec:
      serviceAccountName: liberty-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: init-keystore
        image: registry.access.redhat.com/ubi9/ubi:latest
        command: ["/usr/bin/python3", "/scripts/agent.py", "--init"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: cert-scripts
          mountPath: /scripts
        - name: liberty-security
          mountPath: /config/resources/security
      containers:
      - name: liberty
        image: icr.io/appcafe/open-liberty:full-java17-openj9-ubi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 9080
        - name: https
          containerPort: 9443
        volumeMounts:
        - name: liberty-config-vol
          mountPath: /config/server.xml
          subPath: server.xml
        - name: liberty-ui-vol
          mountPath: /config/apps/ROOT.war/index.html
          subPath: index.html
        - name: liberty-security
          mountPath: /config/resources/security
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1024Mi
      - name: vault-cert-agent
        image: registry.access.redhat.com/ubi9/ubi:latest
        command: ["/usr/bin/python3", "/scripts/agent.py"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: agent
          containerPort: 8000
        volumeMounts:
        - name: cert-scripts
          mountPath: /scripts
        - name: liberty-security
          mountPath: /config/resources/security
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: liberty-config-vol
        configMap:
          name: liberty-config
      - name: liberty-ui-vol
        configMap:
          name: liberty-config
      - name: cert-scripts
        configMap:
          name: liberty-config
          defaultMode: 0755
      - name: liberty-security
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: liberty
  namespace: clm-vault-demo
  labels:
    app: liberty
spec:
  ports:
  - name: http
    port: 9080
    targetPort: 9080
  - name: https
    port: 9443
    targetPort: 9443
  - name: agent
    port: 8000
    targetPort: 8000
  selector:
    app: liberty
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: liberty
  namespace: clm-vault-demo
spec:
  to:
    kind: Service
    name: liberty
  port:
    targetPort: https
  tls:
    termination: passthrough
