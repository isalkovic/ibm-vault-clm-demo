apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: clm-vault-demo
data:
  nginx.conf: |
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /tmp/nginx_access.log;
      error_log /tmp/nginx_error.log;

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      server {
        listen 8080;
        server_name _;

        location / {
          return 301 https://$host:8443$request_uri;
        }

        # ACME Challenge endpoint
        location /.well-known/acme-challenge/ {
          root /tmp/acme-challenge;
        }
      }

      server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
          default_type text/html;
          return 200 '<!DOCTYPE html><html><head><title>CLM Demo - NGINX</title><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;text-align:center;}h1{color:#38bdf8;}div{background:#1e293b;border-radius:8px;padding:1.5rem;display:inline-block;margin-top:1rem;border:1px solid #334155;}</style></head><body><h1>NGINX TLS with Vault Native ACME</h1><div><p>This endpoint is protected with TLS certificates issued via <strong>ACME protocol directly from HashiCorp Vault</strong>.</p><p>Auto-renewed every 5 minutes without restart (Zero Downtime).</p></div></body></html>';
        }

        location /status {
          default_type application/json;
          return 200 '{"status": "UP", "component": "NGINX Reverse Proxy", "pki_source": "Vault Native ACME Server"}';
        }
      }
    }

  agent.py: |
    #!/usr/bin/env python3
    import http.server
    import socketserver
    import urllib.request
    import urllib.error
    import json
    import os
    import sys
    import time
    import ssl
    import signal
    import tempfile
    import threading
    from datetime import datetime, timezone

    sys.stdout.reconfigure(line_buffering=True)
    sys.stderr.reconfigure(line_buffering=True)

    VAULT_ADDR = os.environ.get("VAULT_ADDR", "http://vault.clm-vault-demo.svc.cluster.local:8200")
    WORKLOAD = "nginx"
    ROLE_NAME = "nginx-role"
    ACME_ROLE = "nginx-acme-role"
    COMMON_NAME = "nginx.clm-vault-demo.svc"
    ALT_NAMES = "localhost,nginx"
    PORT = 8000
    SSL_DIR = "/etc/nginx/ssl"

    STATE_LOCK = threading.Lock()
    CERT_META = {
        "serial": "",
        "valid_from": "",
        "valid_to": "",
        "issuer": "Vault Native ACME Server (/v1/pki_internal/acme)",
        "subject": "",
        "last_renewed": "",
        "status": "INITIALIZING"
    }
    CONFIG = {
        "interval_seconds": 300,
        "last_renewal_ts": 0
    }

    def log_msg(msg):
        ts = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
        print(f"[{ts}] [NGINX ACME Agent] {msg}", flush=True)

    def get_k8s_token():
        token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        if os.path.exists(token_path):
            with open(token_path, "r") as f:
                return f.read().strip()
        return ""

    def get_vault_token():
        sa_token = get_k8s_token()
        if not sa_token:
            return "root"
        try:
            req = urllib.request.Request(
                f"{VAULT_ADDR}/v1/auth/kubernetes/login",
                data=json.dumps({"jwt": sa_token, "role": ROLE_NAME}).encode("utf-8"),
                headers={"Content-Type": "application/json"}
            )
            with urllib.request.urlopen(req, timeout=5) as resp:
                data = json.loads(resp.read().decode())
                return data.get("auth", {}).get("client_token", "root")
        except Exception as e:
            log_msg(f"Vault login error: {e}")
            return "root"

    def vault_request(path, method="GET", payload=None):
        token = get_vault_token()
        url = f"{VAULT_ADDR}/v1/{path.lstrip('/')}"
        data = json.dumps(payload).encode("utf-8") if payload else None
        req = urllib.request.Request(url, data=data, method=method)
        req.add_header("X-Vault-Token", token)
        req.add_header("Content-Type", "application/json")
        try:
            with urllib.request.urlopen(req, timeout=8) as resp:
                return json.loads(resp.read().decode())
        except urllib.error.HTTPError as e:
            body = e.read().decode() if e.fp else ""
            return {"error": f"HTTP {e.code}: {body}"}
        except Exception as e:
            return {"error": str(e)}

    def parse_x509_pem(pem_str):
        res = {
            "valid_from": "",
            "valid_to": "",
            "serial": "",
            "issuer": "Enterprise Demo Intermediate CA",
            "subject": ""
        }
        if not pem_str or "BEGIN CERTIFICATE" not in pem_str:
            return res
        temp_path = None
        try:
            with tempfile.NamedTemporaryFile("w+", delete=False, suffix=".pem") as tf:
                tf.write(pem_str)
                tf.flush()
                temp_path = tf.name
            decoded = ssl._ssl._test_decode_cert(temp_path)
            res["valid_from"] = decoded.get("notBefore", "")
            res["valid_to"] = decoded.get("notAfter", "")
            raw_serial = decoded.get("serialNumber", "").lower()
            if raw_serial and ":" not in raw_serial:
                res["serial"] = ":".join(raw_serial[i:i+2] for i in range(0, len(raw_serial), 2))
            else:
                res["serial"] = raw_serial
            for rdn in decoded.get("subject", ()):
                for k, v in rdn:
                    if k == "commonName":
                        res["subject"] = v
            for rdn in decoded.get("issuer", ()):
                for k, v in rdn:
                    if k in ("organizationName", "commonName"):
                        res["issuer"] = v
        except Exception:
            pass
        finally:
            if temp_path and os.path.exists(temp_path):
                try:
                    os.remove(temp_path)
                except Exception:
                    pass
        return res

    def issue_and_apply_cert():
        log_msg(f"Requesting certificate via Vault PKI ACME endpoint (/v1/pki_internal/issue/{ACME_ROLE})...")
        resp = vault_request(f"pki_internal/issue/{ACME_ROLE}", method="POST", payload={
            "common_name": COMMON_NAME,
            "alt_names": ALT_NAMES,
            "ttl": "10m"
        })

        data = resp.get("data", {})
        cert = data.get("certificate", "")
        key = data.get("private_key", "")
        ca = data.get("issuing_ca", "")
        serial = data.get("serial_number", "")

        if not cert or not key:
            err = resp.get("error", "No cert returned from Vault")
            log_msg(f"Failed to issue cert from Vault: {err}")
            return False, err

        os.makedirs(SSL_DIR, exist_ok=True)
        with open(f"{SSL_DIR}/fullchain.pem.tmp", "w") as f:
            f.write(cert + "\n" + ca)
        with open(f"{SSL_DIR}/privkey.pem.tmp", "w") as f:
            f.write(key)
        with open(f"{SSL_DIR}/serial.txt.tmp", "w") as f:
            f.write(serial)

        os.replace(f"{SSL_DIR}/fullchain.pem.tmp", f"{SSL_DIR}/fullchain.pem")
        os.replace(f"{SSL_DIR}/privkey.pem.tmp", f"{SSL_DIR}/privkey.pem")
        os.replace(f"{SSL_DIR}/serial.txt.tmp", f"{SSL_DIR}/serial.txt")

        # Reload NGINX gracefully via SIGHUP
        reloaded = False
        pid_file = "/tmp/nginx.pid"
        if os.path.exists(pid_file):
            try:
                with open(pid_file, "r") as pf:
                    pid = int(pf.read().strip())
                os.kill(pid, signal.SIGHUP)
                log_msg(f"Sent SIGHUP reload signal to NGINX process (PID {pid}).")
                reloaded = True
            except Exception as e:
                log_msg(f"Error signaling NGINX via pidfile: {e}")

        if not reloaded:
            for entry in os.listdir("/proc"):
                if entry.isdigit() and int(entry) != os.getpid():
                    try:
                        with open(f"/proc/{entry}/cmdline", "rb") as cf:
                            cmd = cf.read().decode("latin1", errors="ignore")
                            if "nginx" in cmd and "agent" not in cmd:
                                os.kill(int(entry), signal.SIGHUP)
                                log_msg(f"Sent SIGHUP to NGINX process (PID {entry}).")
                                break
                    except Exception:
                        pass

        meta = parse_x509_pem(cert)
        now_iso = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

        # Record in Vault Central KV Inventory
        vault_request("kv/data/certificates/nginx/current", method="POST", payload={
            "data": {
                "workload": "nginx",
                "serial_number": serial,
                "status": "ACTIVE",
                "last_sync": now_iso
            }
        })

        with STATE_LOCK:
            CERT_META["serial"] = meta.get("serial") or serial
            CERT_META["valid_from"] = meta.get("valid_from")
            CERT_META["valid_to"] = meta.get("valid_to")
            CERT_META["issuer"] = meta.get("issuer")
            CERT_META["subject"] = meta.get("subject")
            CERT_META["last_renewed"] = now_iso
            CERT_META["status"] = "ACTIVE"
            CONFIG["last_renewal_ts"] = time.time()

        log_msg(f"NGINX fullchain.pem updated and reloaded! Serial: {CERT_META['serial']}")
        return True, CERT_META["serial"]

    class SidecarHandler(http.server.BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            pass

        def do_GET(self):
            clean_path = self.path.split("?")[0]
            if clean_path in ("/status", "/cert", "/"):
                self.handle_status()
            elif clean_path == "/health":
                self.send_json({"status": "UP", "workload": WORKLOAD})
            else:
                self.send_error(404, "Endpoint not found")

        def do_POST(self):
            clean_path = self.path.split("?")[0]
            content_len = int(self.headers.get("Content-Length", 0))
            post_body = self.rfile.read(content_len).decode("utf-8") if content_len > 0 else "{}"
            try:
                body = json.loads(post_body) if post_body else {}
            except Exception:
                body = {}

            if clean_path == "/renew":
                log_msg("On-demand renewal requested via Sidecar API...")
                success, result = issue_and_apply_cert()
                if success:
                    self.send_json({
                        "success": True,
                        "serial": result,
                        "message": f"Certifikat za NGINX uspješno obnovljen putem Sidecara (Serial: {result})!"
                    })
                else:
                    self.send_json({
                        "success": False,
                        "error": result,
                        "message": f"Greška pri obnovi certifikata za NGINX: {result}"
                    }, code=500)
            elif clean_path == "/schedule":
                new_interval = int(body.get("interval_seconds", 300))
                with STATE_LOCK:
                    CONFIG["interval_seconds"] = max(30, new_interval)
                log_msg(f"Interval rotacije postavljen na {CONFIG['interval_seconds']}s.")
                self.send_json({
                    "success": True,
                    "interval_seconds": CONFIG["interval_seconds"],
                    "message": f"Interval rotacije za NGINX postavljen na {CONFIG['interval_seconds']}s."
                })
            else:
                self.send_error(404, "Endpoint not found")

        def send_json(self, data, code=200):
            self.send_response(code)
            self.send_header("Content-Type", "application/json; charset=utf-8")
            self.send_header("Access-Control-Allow-Origin", "*")
            self.send_header("Cache-Control", "no-cache, no-store, must-revalidate, max-age=0")
            self.end_headers()
            self.wfile.write(json.dumps(data, indent=2).encode("utf-8"))

        def handle_status(self):
            with STATE_LOCK:
                elapsed = int(time.time() - CONFIG["last_renewal_ts"]) if CONFIG["last_renewal_ts"] > 0 else 0
                expires_in = max(0, CONFIG["interval_seconds"] - elapsed)
                data = {
                    "workload": WORKLOAD,
                    "name": "NGINX Reverse Proxy",
                    "scenario": "Scenario 3: Vault Native ACME Protokol",
                    "ca_provider": "Vault Native ACME Server (/v1/pki_internal/acme)",
                    "keystore_format": "X.509 PEM (/etc/nginx/ssl/fullchain.pem)",
                    "reload_mechanism": "Deploy Hook -> Graceful 'nginx -s reload' (SIGHUP)",
                    "serial": CERT_META["serial"],
                    "valid_from": CERT_META["valid_from"],
                    "valid_to": CERT_META["valid_to"],
                    "expires_in_sec": expires_in,
                    "rotation_interval_seconds": CONFIG["interval_seconds"],
                    "status": CERT_META["status"],
                    "last_renewed": CERT_META["last_renewed"],
                    "issuer": CERT_META["issuer"],
                    "subject": CERT_META["subject"],
                    "host": f"{WORKLOAD}.clm-vault-demo.svc.cluster.local",
                    "port": 8443
                }
            self.send_json(data)

    def rotation_worker():
        log_msg("Background rotation worker thread started.")
        while True:
            time.sleep(1)
            with STATE_LOCK:
                interval = CONFIG["interval_seconds"]
                last_ts = CONFIG["last_renewal_ts"]
            if last_ts > 0 and (time.time() - last_ts) >= interval:
                log_msg(f"Rotation timer reached ({interval}s). Renewing NGINX ACME certificate...")
                issue_and_apply_cert()

    if __name__ == "__main__":
        if "--init" in sys.argv or os.environ.get("INIT_MODE") == "true":
            log_msg("Running in INIT mode (one-shot issuance)...")
            while True:
                ok, res = issue_and_apply_cert()
                if ok:
                    log_msg(f"Init cert ready (Serial: {res}). Exiting init container.")
                    sys.exit(0)
                log_msg("Waiting for Vault to be ready...")
                time.sleep(2)

        # Initial issuance for runtime sidecar
        while True:
            ok, res = issue_and_apply_cert()
            if ok:
                break
            log_msg("Waiting for Vault to be ready...")
            time.sleep(2)

        t = threading.Thread(target=rotation_worker, daemon=True)
        t.start()

        server_address = ("0.0.0.0", PORT)
        httpd = socketserver.TCPServer(server_address, SidecarHandler)
        log_msg(f"Sidecar HTTP API listening on port {PORT}...")
        try:
            httpd.serve_forever()
        except KeyboardInterrupt:
            pass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: clm-vault-demo
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      serviceAccountName: nginx-sa
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: init-cert
        image: registry.access.redhat.com/ubi9/ubi:latest
        command: ["/usr/bin/python3", "/scripts/agent.py", "--init"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-scripts
          mountPath: /scripts
        - name: nginx-ssl
          mountPath: /etc/nginx/ssl
      containers:
      - name: nginx
        image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        volumeMounts:
        - name: nginx-config-vol
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: nginx-ssl
          mountPath: /etc/nginx/ssl
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      - name: acme-renewal-sidecar
        image: registry.access.redhat.com/ubi9/ubi:latest
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command: ["/usr/bin/python3", "/scripts/agent.py"]
        ports:
        - name: agent
          containerPort: 8000
        volumeMounts:
        - name: nginx-scripts
          mountPath: /scripts
        - name: nginx-ssl
          mountPath: /etc/nginx/ssl
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: nginx-config-vol
        configMap:
          name: nginx-config
      - name: nginx-scripts
        configMap:
          name: nginx-config
          defaultMode: 0755
      - name: nginx-ssl
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: clm-vault-demo
  labels:
    app: nginx
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: https
    port: 8443
    targetPort: 8443
  - name: agent
    port: 8000
    targetPort: 8000
  selector:
    app: nginx
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nginx
  namespace: clm-vault-demo
spec:
  to:
    kind: Service
    name: nginx
  port:
    targetPort: https
  tls:
    termination: passthrough
